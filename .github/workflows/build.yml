name: Build Windows Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 keyboard pyinstaller

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller "Pen 11.spec" --noconfirm --clean

    - name: Verify and Prepare Executable
      run: |
        if (Test-Path "dist\Pen 11.exe") {
            Copy-Item -Path "dist\Pen 11.exe" -Destination "dist\Pen11-x64.exe"
            Write-Host "Build verified successfully. Size: $((Get-Item 'dist\Pen 11.exe').Length) bytes"
        } else {
            Write-Error "dist\Pen 11.exe not found!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pen11-Windows-x64
        path: |
          dist/Pen 11.exe
          dist/Pen11-x64.exe
